name: Atualizar dashboard

on:
  push:
    paths:
      - "dados/17. Atualização de SCAs/**"
      - "scripts/process_data.py"
      - "config/**"
      - "index.html"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/atualizar-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  atualizar-e-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/process_data.py
      - name: Registrar JSONs atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados-processados
          git diff --cached --quiet || git commit -m "Atualiza dados processados"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment

